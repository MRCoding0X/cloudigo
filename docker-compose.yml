services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cloudigo_dev
    ports:
      - "5432:5432"
    volumes:
      - cloudigo_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      # APP_ENV=production makes the refresh-token cookie Secure (HTTPS-only).
      # Only set it once a TLS-terminating reverse proxy sits in front of this
      # stack - over plain HTTP, login will silently fail to persist a
      # session if this is "production". See README "Deploy" section.
      APP_ENV: development
      PORT: 8080
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/cloudigo_dev?sslmode=disable
      STORAGE_PATH: /app/storage
      FRONTEND_URL: http://localhost:3000
      JWT_ACCESS_SECRET: dev-only-access-secret-change-me
      JWT_REFRESH_SECRET: dev-only-refresh-secret-change-me
    ports:
      - "8080:8080"
    volumes:
      - cloudigo_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  cloudigo_pg_data:
  cloudigo_storage:
